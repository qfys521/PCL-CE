<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  PCL-CE-Linux AppImage font configuration.

  AppRun exports FONTCONFIG_FILE="$APPDIR/usr/etc/fonts/fonts.conf".
  Because FONTCONFIG_FILE replaces the host configuration, this file sets up
  both the bundled fonts and the host font directories itself:

  * <dir prefix="relative"> is resolved by fontconfig against the directory of
    this file, i.e. usr/etc/fonts/../../share/fonts = $APPDIR/usr/share/fonts,
    which contains Noto Sans CJK SC Regular/Bold.  The AppImage can therefore
    be mounted at any path.
  * The host font directories are still scanned, so fonts installed on the
    system keep working and only CJK text is guaranteed by the bundled font.
  * The cache must never be written into the read-only AppImage or into /tmp:
    <cachedir prefix="xdg"> resolves to $XDG_CACHE_HOME/pcl-ce/fontconfig
    (or ~/.cache/pcl-ce/fontconfig when XDG_CACHE_HOME is unset).
-->
<fontconfig>
  <!-- Bundled fonts: Noto Sans CJK SC Regular / Bold -->
  <dir prefix="relative">../../share/fonts</dir>

  <!-- Per-user fonts -->
  <dir>~/.fonts</dir>
  <dir prefix="xdg">fonts</dir>

  <!-- Host fonts (still preferred for Latin if the host has a nicer face) -->
  <dir>/usr/local/share/fonts</dir>
  <dir>/usr/share/fonts</dir>

  <!-- Writable cache under $XDG_CACHE_HOME, never inside the AppImage or /tmp -->
  <cachedir prefix="xdg">pcl-ce/fontconfig</cachedir>

  <!-- Load the host's fontconfig rules (hinting, antialiasing, generic family
       aliases such as DejaVu Sans for sans-serif).  These are rule files only;
       the font directories above are authoritative.  ignore_missing keeps the
       AppImage usable on systems without /etc/fonts/conf.d. -->
  <include ignore_missing="yes">/etc/fonts/conf.d</include>

  <!-- Simplified/Traditional Chinese must never fall back to a Latin-only face:
       prefer the bundled Noto Sans CJK SC whenever a zh language is requested. -->
  <match target="pattern">
    <test name="lang" compare="contains">
      <string>zh</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Sans CJK SC</string>
    </edit>
  </match>

  <!-- Keep the bundled CJK font reachable through the generic families even on
       systems where the preferred Latin font has no CJK coverage. -->
  <alias binding="same">
    <family>sans-serif</family>
    <prefer>
      <family>Noto Sans CJK SC</family>
    </prefer>
  </alias>
  <alias binding="same">
    <family>system-ui</family>
    <prefer>
      <family>Noto Sans CJK SC</family>
    </prefer>
  </alias>
</fontconfig>
